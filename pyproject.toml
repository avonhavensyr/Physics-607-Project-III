[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sho-mcmc"
version = "0.1.0"
description = "Metropolis sampling of the harmonic oscillator path integral on a lattice"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Javad Yousefian" },
    { name = "Alexandra VonHaven" },
    { name = "Kevin Geumhan" },
]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.scripts]
sho-mcmc = "sho_mcmc.main:main"
sho-mcmc-inject = "sho_mcmc.injection:main"
